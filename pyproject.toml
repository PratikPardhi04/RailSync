[project]
name = "raillink-ai-backend"
version = "0.1.0"
description = "RailLink AI agentic planning brain"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "pydantic==2.5.0",
    "passlib[bcrypt]==1.7.4",
    "PyJWT==2.8.0",
    "python-multipart==0.0.6",
    "ortools==9.8.3296",
    "faiss-cpu==1.7.4",
    "numpy==1.26.2",
    "langgraph==1.2.11",
    "langchain==0.1.0",
    "langchain-community==0.0.10",
    "langchain-groq==0.0.1",
    "python-dotenv==1.0.0",
]

[tool.langgraph]
    enable_probe_image = true